<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>내 차 어디? - 주차 위치 기억</title>
<style>
:root{--pri:#1f6feb;--bg:#f2f4f8;--ink:#17202b;--mute:#6b7685;--line:#e3e7ee}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:-apple-system,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:480px;min-height:100%;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
h1{font-size:18px;margin:4px 0 12px;color:var(--mute);font-weight:600}
button{font:inherit;cursor:pointer}
.hide{display:none!important}

/* 홈화면: 카메라 영역 */
#idle{flex:1;display:flex;flex-direction:column;min-height:0}
#cam{position:relative;flex:1;min-height:320px;max-height:620px;border-radius:28px;overflow:hidden;background:#0d1b33;cursor:pointer;box-shadow:0 10px 28px rgba(31,111,235,.25);-webkit-tap-highlight-color:transparent;user-select:none}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#camFallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;background:var(--pri);font-size:26px;font-weight:800;text-align:center;padding:20px}
#camFallback small{font-size:15px;font-weight:500;opacity:.85}
#camHint{position:absolute;left:0;right:0;bottom:0;padding:18px 12px 20px;text-align:center;color:#fff;font-weight:700;font-size:17px;background:linear-gradient(transparent,rgba(0,0,0,.55))}
#camHint i{display:block;width:62px;height:62px;margin:0 auto 8px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.25)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:fl .35s}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}
#cam:active #camHint i{background:#fff}
#skip{align-self:center;margin:12px 0 4px;padding:8px 14px;border:0;background:none;color:var(--mute);font-size:14px;text-decoration:underline}

/* 다음화면 */
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px}
.when{color:var(--mute);font-size:14px}
.where{font-size:34px;font-weight:800;margin:4px 0 10px;word-break:break-all}
.photo{width:100%;border-radius:14px;display:block;margin:10px 0;max-height:52vh;object-fit:cover}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chips button{padding:9px 14px;border:1px solid var(--line);background:#fff;border-radius:20px;font-size:15px}
.chips button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
input[type=text]{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;font:inherit;font-size:16px;margin-bottom:10px}
.tools{display:flex;gap:8px}
.tools>*{flex:1;text-align:center;padding:13px 8px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;font-size:15px}
#found{width:100%;margin-top:14px;padding:20px;border:0;border-radius:18px;background:#16a34a;color:#fff;font-size:22px;font-weight:800}

details{margin-top:18px;font-size:14px}
summary{color:var(--mute);cursor:pointer;padding:6px 0}
.hist{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.hist img{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#ddd}
.hist .t{flex:1}
.hist button{border:0;background:none;color:#c33}
.sub{color:var(--mute);font-size:13px}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <h1>🚗 내 차 어디?</h1>

  <!-- 홈화면 -->
  <div id="idle">
    <div id="cam" onclick="shoot()">
      <video id="video" playsinline muted autoplay class="hide"></video>
      <div id="camFallback"><span>📷 탭해서 사진 찍기</span><small>찍으면 바로 저장돼요</small></div>
      <div id="camHint" class="hide"><i></i>탭하면 촬영하고 바로 저장</div>
      <div id="flash"></div>
    </div>
    <button id="skip" onclick="park('')">사진 없이 저장</button>
  </div>

  <!-- 다음화면 -->
  <div id="parked" class="hide">
    <div class="card">
      <div class="when" id="when"></div>
      <div class="where hide" id="where"></div>
      <img id="photo" class="photo hide" alt="">
      <div class="chips" id="floors"></div>
      <input type="text" id="zone" placeholder="구역·기둥 번호 (선택)" onchange="setZone(this.value)">
      <div class="tools">
        <button onclick="retake()" id="photoBtn">📷 사진</button>
        <a id="mapBtn" class="hide" target="_blank" rel="noopener">🗺 지도</a>
      </div>
    </div>
    <button id="found" onclick="found()">✅ 차 찾았어요</button>
  </div>
  <input type="file" id="file" accept="image/*" capture="environment" class="hide">

  <details id="histBox" class="hide" open>
    <summary>지난 기록</summary>
    <div id="hist"></div>
  </details>
</div>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id), MAX=5;
const FLOORS=['지상','B1','B2','B3','B4','1F','2F','3F'];

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2200)}
function load(){try{return JSON.parse(localStorage.getItem('parking')||'[]')}catch(e){return[]}}
function store(list){
  // 용량 초과 시 오래된 기록부터 줄여서 저장
  while(list.length){try{localStorage.setItem('parking',JSON.stringify(list));return true}catch(e){list.pop()}}
  try{localStorage.removeItem('parking')}catch(e){}
  return false;
}
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const current=()=>load().find(x=>!x.done);
function update(id,patch){
  const list=load().map(x=>x.id===id?{...x,...patch}:x);
  if(!store(list)) toast('저장 공간이 부족해요');
  render();
}

/* ---------- 카메라 ---------- */
let stream=null, camFailed=false;
async function startCam(){
  if(stream||camFailed||!navigator.mediaDevices?.getUserMedia) return;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    const v=$('video'); v.srcObject=stream; await v.play().catch(()=>{});
    v.classList.remove('hide'); $('camHint').classList.remove('hide'); $('camFallback').classList.add('hide');
  }catch(e){ camFailed=true; stream=null; }
}
function stopCam(){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  const v=$('video'); v.srcObject=null; v.classList.add('hide');
  $('camHint').classList.add('hide'); $('camFallback').classList.remove('hide');
}
function snapshot(src,w,h){
  const s=Math.min(1,800/w), cv=document.createElement('canvas');
  cv.width=Math.round(w*s); cv.height=Math.round(h*s);
  cv.getContext('2d').drawImage(src,0,0,cv.width,cv.height);
  return cv.toDataURL('image/jpeg',.7);
}
// 홈화면 카메라 영역 탭: 라이브 화면이 있으면 바로 촬영, 없으면 기본 카메라 앱 호출
function shoot(){
  const v=$('video');
  if(stream && v.videoWidth){
    $('flash').classList.remove('go'); void $('flash').offsetWidth; $('flash').classList.add('go');
    park(snapshot(v,v.videoWidth,v.videoHeight));
  } else { $('file').click() }
}
function retake(){
  // 다음화면에서 다시 찍기: 기본 카메라 앱 호출
  $('file').click();
}
$('file').addEventListener('change',e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  const img=new Image(), url=URL.createObjectURL(f);
  img.onload=()=>{
    const data=snapshot(img,img.width,img.height); URL.revokeObjectURL(url);
    const c=current();
    if(c) update(c.id,{photo:data}); else park(data);
  };
  img.src=url;
});

/* ---------- 저장 ---------- */
// 저장은 즉시, GPS는 나중에 채움
function park(photo){
  const id=Date.now();
  const list=load();
  list.unshift({id,t:id,floor:'',zone:'',photo:photo||'',pos:null,done:false});
  if(!store(list.slice(0,MAX))) toast('저장 공간이 부족해요');
  render();
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      p=>{ if(load().some(x=>x.id===id&&!x.done)) update(id,{pos:{lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)}}) },
      ()=>{},{enableHighAccuracy:true,timeout:10000,maximumAge:0});
  }
  toast('저장했어요');
}
function setFloor(f){const c=current();if(c)update(c.id,{floor:c.floor===f?'':f})}
function setZone(v){const c=current();if(c)update(c.id,{zone:v.trim()})}
function found(){const c=current();if(c){update(c.id,{done:true});toast('안전 운전하세요 🚗')}}
function remove(id){store(load().filter(x=>x.id!==id));render()}

function ago(t){
  const m=Math.floor((Date.now()-t)/60000);
  if(m<1) return '방금 전 주차';
  if(m<60) return m+'분 전 주차';
  const h=Math.floor(m/60);
  if(h<24) return h+'시간 '+(m%60)+'분 전 주차';
  return Math.floor(h/24)+'일 전 주차';
}

function render(){
  const c=current();
  $('idle').classList.toggle('hide',!!c);
  $('parked').classList.toggle('hide',!c);
  if(c){
    stopCam();
    $('when').textContent=ago(c.t);
    const txt=[c.floor,c.zone].filter(Boolean).join(' ');
    $('where').textContent=txt; $('where').classList.toggle('hide',!txt);
    $('photo').classList.toggle('hide',!c.photo); if(c.photo) $('photo').src=c.photo;
    $('photoBtn').textContent=c.photo?'📷 다시 찍기':'📷 사진';
    if(document.activeElement!==$('zone')) $('zone').value=c.zone||'';
    $('floors').innerHTML=FLOORS.map(f=>`<button class="${f===c.floor?'on':''}" onclick="setFloor('${f}')">${f}</button>`).join('');
    const m=$('mapBtn');
    if(c.pos){m.href=`https://www.google.com/maps/search/?api=1&query=${c.pos.lat},${c.pos.lng}`;m.textContent=`🗺 지도 (±${c.pos.acc}m)`;m.classList.remove('hide')}
    else m.classList.add('hide');
  } else startCam();

  const past=load().filter(x=>x.done);
  $('histBox').classList.toggle('hide',!past.length);
  $('hist').innerHTML=past.map(x=>`<div class="hist">
    ${x.photo?`<img src="${x.photo}" alt="">`:'<img alt="">'}
    <div class="t">${esc([x.floor,x.zone].filter(Boolean).join(' ')||'메모 없음')}<div class="sub">${new Date(x.t).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div></div>
    <button onclick="remove(${x.id})">삭제</button></div>`).join('');
}

// 앱이 백그라운드로 가면 카메라를 끄고, 돌아오면 다시 켬
document.addEventListener('visibilitychange',()=>{
  if(document.hidden) stopCam(); else if(!current()) startCam();
});

render();
setInterval(render,60000);
if('serviceWorker' in navigator && location.protocol!=='file:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
